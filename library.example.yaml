default_dirs:
  skills:
    - project: .agents/skills/
    - global: ~/.agents/skills/
  agents:
    - project: .agents/agents/
    - global: ~/.agents/agents/
  prompts:
    - project: .agents/commands/
    - global: ~/.agents/commands/
  mcp:
    - project: .claude/mcp/
    - global: ~/.claude/mcp/

agentic-library:
  # Skills from other GitHub repos are normal entries, e.g.:
  #   - name: grill-me
  #     description: <from the SKILL.md frontmatter>
  #     source: https://github.com/<org>/<repo>/blob/main/grill-me/SKILL.md
  # Add them with `/agentic-library add <owner/repo>`.
  skills: []
  agents: []
  prompts: []
  mcp: []
