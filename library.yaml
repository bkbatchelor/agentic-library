default_dirs:
  skills:
    - default: .agents/skills/
    - global: ~/.agents/skills/
  agents:
    - default: .agents/agents/
    - global: ~/.agents/agents/
  prompts:
    - default: .agents/commands/
    - global: ~/.agents/commands/

library:
  skills:
    - name: commit-changes
      description: Guidelines and instructions for creating Conventional Commit messages following the standard specification and qoomon's cheatsheet. Use whenever staging git changes, drafting git commits, or generating commit messages.
      source: https://github.com/bkbatchelor/agentic-skills/blob/main/commit-changes/SKILL.md
  agents: []
  prompts: []
